[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.1.0"
description = "Fünf kleine, unabhängige String-Hilfsfunktionen (nur Standardbibliothek)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["textutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
